name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the packages to NuGet (a tag does it always)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  BINARY_REPOSITORY: binance/binance-connector-cpp
  RIDS: win-x64 win-x86 win-arm64 linux-x64 linux-arm64 linux-arm linux-musl-x64 linux-musl-arm64 osx-x64 osx-arm64

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Check that the tag is the version of the packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not v$version (Directory.Build.props)"
            exit 1
          fi

      - name: Download the platform binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          native=$(cat src/Binance.Common/native-version.txt)
          for rid in $RIDS; do
            gh release download "v$native" --repo "$BINARY_REPOSITORY" --pattern "binance_c-$native-$rid.zip" --dir "$RUNNER_TEMP"
            mkdir -p "src/Binance.Common/runtimes/$rid/native"
            unzip -o "$RUNNER_TEMP/binance_c-$native-$rid.zip" -d "src/Binance.Common/runtimes/$rid/native"
          done

      - name: Build
        run: dotnet build Binance.slnx -c Release

      - name: Format check
        run: dotnet format whitespace Binance.slnx --verify-no-changes

      - name: Test
        env:
          BINANCE_C_LIB: ${{ github.workspace }}/src/Binance.Common/runtimes/linux-x64/native/libbinance_c.so
        run: dotnet test Binance.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Binance.slnx -c Release --no-build -o artifacts

      - name: Check that every platform binary is in Binance.Common
        run: |
          for rid in $RIDS; do
            unzip -l artifacts/Binance.Common.[0-9]*.nupkg | grep -q "runtimes/$rid/native/" || { echo "::error::no binary for $rid"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

      - name: Log in to NuGet
        id: nuget
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub release and attach the packages
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version} " 'index($0, heading) == 1 {p = 1; next} /^## / {p = 0} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::No CHANGELOG.md entry for $version"; exit 1; }
          
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
